name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Generated parser matches grammar.js
        run: |
          npx tree-sitter generate
          git diff --exit-code -- src
      - name: Corpus and query tests
        run: npx tree-sitter test
      - name: Build browser parser
        run: npm run build:wasm
      - name: Round-trip canonical fixtures through the built parser
        run: npm run roundtrip -- test/roundtrip
